<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrindopnishad</title>
    <!-- 
        This is the main entry point for Vrindopnishad.
        It routes users to the mobile-optimized home page or the big screen version
        based on their device type and screen width.
    -->
    <script>
        (function () {
            function isMobile() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
                const isSmallScreen = window.innerWidth <= 768;
                return isMobileUA || isSmallScreen;
            }

            if (isMobile()) {
                window.location.replace("Vrindopnishad Web/Home/main/index(forSmallScreen).html");
            } else {
                window.location.replace("Vrindopnishad Web/Home/main/index(forBigScreen).html");
            }
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #040307;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
        }

        .loader {
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #64b5f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Entering the Sanctuary...</p>
    </div>
</body>

</html>
