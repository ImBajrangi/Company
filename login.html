<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Login — Vrindopnishad</title>

    <!-- Design tokens from index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js" defer></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --accent-color: #000000;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --glass-bg: rgba(0, 0, 0, 0.8);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-primary);
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Subtle background texture like index.html */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(var(--text-color), 0.02) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(var(--text-color), 0.02) 0%, transparent 40%);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transform: translateY(0);
            transition: transform 0.6s var(--transition-smooth), opacity 0.6s var(--transition-smooth);
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            background: rgba(var(--text-color), 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: all 0.3s var(--transition-smooth);
        }

        input:focus {
            background: rgba(var(--text-color), 0.05);
            border-color: var(--text-color);
            box-shadow: 0 0 0 4px rgba(var(--text-color), 0.05);
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border-radius: 12px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--text-color);
            color: var(--bg-color);
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            opacity: 0.3;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--text-color);
        }

        .divider:not(:empty)::before {
            margin-right: 1rem;
        }

        .divider:not(:empty)::after {
            margin-left: 1rem;
        }

        .btn-social {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
        }

        .btn-social:hover {
            background: rgba(var(--text-color), 0.05);
            border-color: var(--text-color);
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.25rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        #error-message {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4444;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            text-align: center;
        }

        /* Loading animation */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(var(--bg-color), 0.3);
            border-top-color: var(--bg-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Page entry animation */
        .fade-in {
            animation: fadeIn 0.8s var(--transition-smooth) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="fade-in">
    <div class="login-container">
        <div class="header">
            <img src="Vrindopnishad Web/class/v-logo-rounded/android-chrome-192x192.png" alt="Logo" class="logo">
            <h1>Welcome Back</h1>
            <p class="subtitle">Enter your sanctuary of wisdom</p>
        </div>

        <div id="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn">
                <span class="btn-text">Sign In</span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <div class="divider">or continue with</div>

        <button class="btn btn-social" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18"
                alt="Google">
            Google
        </button>

        <div class="footer-links">
            Don't have an account? <a href="#" id="toggle-signup">Create one</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const errorEl = document.getElementById('error-message');
            const toggleSignup = document.getElementById('toggle-signup');
            const h1 = document.querySelector('h1');
            const subtitle = document.querySelector('.subtitle');
            const btnText = document.querySelector('.btn-text');
            const spinner = document.querySelector('.loading-spinner');
            let isSignUp = false;

            // Handle Signup Toggle
            toggleSignup.addEventListener('click', (e) => {
                e.preventDefault();
                isSignUp = !isSignUp;
                h1.textContent = isSignUp ? 'Begin Journey' : 'Welcome Back';
                subtitle.textContent = isSignUp ? 'Create your spiritual profile' : 'Enter your sanctuary of wisdom';
                btnText.textContent = isSignUp ? 'Join Now' : 'Sign In';
                toggleSignup.textContent = isSignUp ? 'Sign In' : 'Create one';
                errorEl.style.display = 'none';
            });

            // Handle Form Submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.style.display = 'none';
                btnText.style.display = 'none';
                spinner.style.display = 'block';

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    let result;
                    if (isSignUp) {
                        result = await window.supabaseClient.auth.signUp({ email, password });
                    } else {
                        result = await window.supabaseClient.auth.signInWithPassword({ email, password });
                    }

                    if (result.error) throw result.error;

                    // Success - Redirect
                    const urlParams = new URLSearchParams(window.location.search);
                    window.location.href = urlParams.get('redirect') || '/index.html';

                } catch (error) {
                    errorEl.textContent = error.message;
                    errorEl.style.display = 'block';
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                }
            });

            // Handle Google Login
            document.getElementById('google-btn').addEventListener('click', async () => {
                try {
                    const { error } = await window.supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/index.html'
                        }
                    });
                    if (error) throw error;
                } catch (error) {
                    errorEl.textContent = error.message;
                    errorEl.style.display = 'block';
                }
            });
        });
    </script>
</body>

</html>
