<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./Vrindopnishad Web/class/logo/v-logo-transparent.png" type="image/png">
    <title>Vrindopnishad</title>
    <script>
        (function () {
            function isMobile() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
                const isSmallScreen = window.innerWidth <= 768;
                return isMobileUA || isSmallScreen;
            }

            if (isMobile()) {
                window.location.replace("Vrindopnishad Web/Home/main/index(forSmallScreen).html");
            } else {
                window.location.replace("Vrindopnishad Web/Home/main/index(forBigScreen).html");
            }
        })();
    </script>
</head>

</html>
