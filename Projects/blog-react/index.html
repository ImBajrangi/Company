<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vrindopnishad — Home Archive</title>
    <!-- Tailwind CDN with Stitch Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <!-- Newsreader & Material Symbols from Stitch -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- DM Sans for Body from Reading Room -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1717cf",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111121",
                        "cinema-dark": "#0A0A0A",
                        "surface-light": "#FAFAFA",
                        "text-main": "#1A1A1A",
                        "text-muted": "#8C8C8C",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"],
                        "body": ["DM Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #FAFAFA;
            color: #1A1A1A;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4, .font-display {
            font-family: 'Newsreader', serif;
        }
        
        .grayscale-img {
            filter: grayscale(100%);
            transition: filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .group:hover .grayscale-img {
            filter: grayscale(0%);
        }

        .title-hover-italic {
            transition: font-style 0.3s ease;
        }

        .group:hover .title-hover-italic {
            font-style: italic;
        }
        
        .masonry-grid {
            column-count: 1;
            column-gap: 2rem;
        }
        
        @media (min-width: 768px) {
            .masonry-grid {
                column-count: 2;
                column-gap: 4rem;
            }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 4rem;
        }

        /* Material Symbols Integration */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
