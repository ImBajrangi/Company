<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="https://imbajrangi.github.io/Company/Vrindopnishad%20Web/class/logo/v-logo-transparent.png" type="image/png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vrindopnishad - Offline</title>

    <style media="screen">
      body { 
        /* Changed background to black for the fireworks effect */
        background: #000; 
        color: #eee; /* Changed default text color for dark theme */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        margin: 0; 
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Hide scrollbars that might appear from the canvas */
        overflow: hidden;
      }
      #message { 
        /* Enhanced liquid glass effect */
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px); /* For Safari */
        border: 1px solid rgba(255, 255, 255, 0.18);
        max-width: 500px; 
        margin: 20px;
        padding: 40px; 
        border-radius: 20px; /* Slightly more rounded corners */
        text-align: center;
        /* Ensure the message is on top of the fireworks */
        z-index: 10;
        position: relative;
        transition: opacity 0.4s ease, transform 0.4s ease;
        transform: scale(1);
      }
      #message.hidden {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.9);
      }
      #message h3 { 
        color: #ccc; 
        font-weight: 500; 
        font-size: 18px; 
        margin: 24px 0 16px; 
      }
      #message h2 { 
        /* Modern rich gradient color for "Offline" */
        background: linear-gradient(45deg, #f9a834, #d7958d);
        -webkit-background-clip: text;
        -moz-background-clip: text;
        -webkit-text-fill-color: transparent; 
        -moz-text-fill-color: transparent;
        font-weight: bold; 
        font-size: 80px; /* Increased size */
        margin: 0;
        line-height: 1;
      }
      #message h1 { 
        font-size: 28px; 
        font-weight: 600; 
        color: #f5f5f7; /* Apple-like off-white */
        margin: 16px 0 24px;
      }
      #message p { 
        line-height: 1.6; 
        margin: 16px 0 24px; 
        font-size: 16px;
        color: #d1d1d6; /* Softer text color */
      }
      #message a { 
        display: inline-block; 
        text-align: center; 
        /* Rich gradient button */
        background: linear-gradient(45deg, #288cff, #257fc9); 
        text-transform: uppercase; 
        text-decoration: none; 
        color: white; 
        padding: 16px 32px; 
        border: none;
        border-radius: 30px;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      #message a:hover {
        transform: scale(1.03); /* Enhanced hover effect */
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }
      #message { /* Updated shadow for the card */
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
      }
      @media (max-width: 600px) {
        #message { 
          margin: 16px;
          padding: 24px;
        }
        #message h2 {
          font-size: 60px;
        }
      }
      
      /* Style for the fireworks canvas */
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

    </style>
  </head>
  <body>
    <!-- Canvas for the fireworks effect -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Original 404 message content -->
    <div id="message">
      <h2>Offline</h2>
      <h1>No Internet Connection</h1>
      <p>Sorry, it seems you are not connected to the internet. The content of this page cannot be displayed. Please check your connection and try again.</p>
      <a href="/">Try Again</a>
    </div>

    <!-- JavaScript for the fireworks effect -->
    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        
        let fireworks = [];
        let particles = [];
        let hue = 10; // Start with a green hue

        // Set canvas to full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- Helper Functions ---
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // --- Classes ---
        class Firework {
            constructor(startX, startY, endX, endY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.distanceToEnd = Math.hypot(endX - startX, endY - startY);
                this.distanceTraveled = 0;
                
                this.trail = [];
                this.trailLength = 5;

                this.angle = Math.atan2(endY - startY, endX - startX);
                this.speed = 5;
                this.acceleration = 1.09;
                this.brightness = random(40, 80);
                this.targetRadius = 1;
                this.hue = hue;
            }

            update() {
                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.pop();
                }

                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                
                this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

                if (this.distanceTraveled >= this.distanceToEnd) {
                    createParticles(this.endX, this.endY, this.hue);
                    return true; // Firework has exploded
                } else {
                    this.x += vx;
                    this.y += vy;
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                const lastTrailPoint = this.trail[this.trail.length - 1] || { x: this.x, y: this.y };
                ctx.moveTo(lastTrailPoint.x, lastTrailPoint.y);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.angle = random(0, Math.PI * 2);
                this.speed = random(1, 40);
                this.friction = 0.95;
                this.gravity = 1;
                this.hue = hue;
                this.brightness = random(40, 80);
                this.alpha = 1;
                this.decay = random(0.015, 0.03);
                
                this.trail = [];
                this.trailLength = 5;
            }

            update() {
                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.pop();
                }

                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                
                return this.alpha <= this.decay;
            }

            draw() {
                ctx.beginPath();
                const lastTrailPoint = this.trail[this.trail.length - 1] || { x: this.x, y: this.y };
                ctx.moveTo(lastTrailPoint.x, lastTrailPoint.y);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }
        
        // --- Main Functions ---
        function launchFirework(targetX) {
             const startX = canvas.width / 2;
             const startY = canvas.height;
             const endY = random(canvas.height * 0.1, canvas.height * 0.5);
             fireworks.push(new Firework(startX, startY, targetX, endY));
        }

        function createParticles(x, y, baseHue) {
            const particleCount = 400;
            for (let i = 0; i < particleCount; i++) {
                // Add a bit of color variation to the explosion
                const particleHue = baseHue + random(-20, 20);
                particles.push(new Particle(x, y, particleHue));
            }
        }
        
        let autoLaunchTimer = 0;
        let autoLaunchInterval = random(20, 80); // ticks between launches

        // --- Animation Loop ---
        function animate() {
            // Create a semi-transparent background to create a trail effect
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            
            // Auto-launch fireworks
            if(autoLaunchTimer >= autoLaunchInterval) {
                launchFirework(random(0, canvas.width));
                autoLaunchTimer = 0;
                autoLaunchInterval = random(30, 90);
            } else {
                autoLaunchTimer++;
            }

            // Animate fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].draw();
                if (fireworks[i].update()) {
                    fireworks.splice(i, 1);
                }
            }

            // Animate particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].draw();
                if (particles[i].update()) {
                    particles.splice(i, 1);
                }
            }

            hue += 0.5; // Cycle through colors
            if (hue > 360) hue = 0;

            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();
    </script>
  </body>
</html>
