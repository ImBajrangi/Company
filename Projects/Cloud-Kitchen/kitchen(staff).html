<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Kitchen Order System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay SDK for Payment Processing -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Google Charts Loader -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
        }
        .view-active {
            display: block !important;
        }
        .view-hidden {
            display: none !important;
        }
        .btn-active {
            background: #0071e3;
            color: white;
        }
        
        /* Status Colors */
        .status-new { background: #0071e3; color: white; }
        .status-preparing { background: #ff9500; color: white; }
        .status-ready_for_pickup { background: #34c759; color: white; }
        .status-out_for_delivery { background: #5e5ce6; color: white; }
        .status-delivered, .status-completed { background: #8e8e93; color: white; }
        .status-TEST_ORDER { background: #9453c0; color: white; }
        
        .card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        
        button, .card, input, .menu-item {
            transition: all 0.3s ease;
        }
        
        .menu-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }
        
        .btn-primary {
            background: #0071e3;
            color: white;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #0077ed;
            transform: scale(1.02);
        }
        
        input, select, textarea {
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 16px 18px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            min-height: 52px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }
        
        #order-progress-bar {
            transition: width 0.6s ease;
            background: #0071e3;
        }
        
        .icon { width: 20px; height: 20px; stroke-width: 2; }
        .icon-lg { width: 24px; height: 24px; stroke-width: 2; }
    </style>
</head>
<body class="text-gray-900">

    <div class="container mx-auto p-4 sm:p-6 max-w-7xl">
        <header class="card p-4 sm:p-6 mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-black rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 sm:w-7 sm:h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-semibold text-gray-900">CloudKitchen</h1>
                        <p class="text-sm text-gray-500 hidden sm:block">Fresh meals delivered</p>
                    </div>
                </div>
                
                <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                     <div class="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2">
                        <svg class="icon text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <div id="auth-status" class="text-sm font-medium text-gray-700">Guest</div>
                    </div>
                    <button id="auth-btn" class="bg-black text-white px-4 py-2 text-sm font-medium rounded-lg hover:bg-gray-800 transition-all w-full sm:w-auto">
                        Login / Profile
                    </button>

                    <div id="view-switcher" class="flex items-center bg-gray-100 rounded-lg p-1 gap-1 w-full sm:w-auto">
                        <button data-view="customer" class="px-4 py-2 text-sm font-medium rounded-md transition-all flex-1 sm:flex-none">Order</button>
                        <button data-view="kitchen" class="hidden px-4 py-2 text-sm font-medium rounded-md transition-all flex-1 sm:flex-none">Kitchen</button>
                        <button data-view="transport" class="hidden px-4 py-2 text-sm font-medium rounded-md transition-all flex-1 sm:flex-none">Delivery</button>
                        <button data-view="owner" class="hidden px-4 py-2 text-sm font-medium rounded-md transition-all flex-1 sm:flex-none bg-red-600 text-white">Owner</button>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <!-- Customer View -->
            <div id="customer-view" class="view-hidden">
                <!-- Customer View content remains here -->
            </div>

            <!-- Kitchen View -->
            <div id="kitchen-view" class="view-hidden card p-6 sm:p-8">
                <!-- Kitchen View content remains here -->
            </div>

            <!-- Transport View -->
            <div id="transport-view" class="view-hidden card p-6 sm:p-8">
                <!-- Transport View content remains here -->
            </div>
            
            <!-- Owner View -->
            <div id="owner-view" class="view-hidden space-y-8">
                <div class="card p-6 sm:p-8">
                    <h2 class="text-3xl font-semibold text-gray-900 mb-6">Owner Dashboard</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Sales Over Time</h3>
                            <div id="sales_chart_div" style="width: 100%; height: 400px;"></div>
                        </div>
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Order Status Breakdown</h3>
                            <div id="status_chart_div" style="width: 100%; height: 400px;"></div>
                        </div>
                    </div>
                </div>

                <div class="card p-6 sm:p-8">
                    <h2 class="text-2xl font-semibold text-gray-900 mb-6">Staff Management</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Add New Staff Member</h3>
                            <form id="add-staff-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Staff Email</label>
                                    <input type="email" id="staff-email" placeholder="staff@example.com" class="w-full" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Assign Role</label>
                                    <select id="staff-role" class="w-full" required>
                                        <option value="kitchen">Kitchen Staff</option>
                                        <option value="delivery">Delivery Staff</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-green-600 text-white font-medium py-3 rounded-xl hover:bg-green-700 transition-all">Add Staff</button>
                            </form>
                        </div>
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Current Staff</h3>
                            <div id="staff-list" class="space-y-3 max-h-96 overflow-y-auto">
                                <p class="text-gray-500">No staff members found.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Other views like Developer View remain here -->
        </main>
        
        <!-- All modals remain here -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, where, serverTimestamp, getDoc, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Hardcoded Owner Email (for initial setup) ---
        const OWNER_EMAIL = "owner@example.com"; // CHANGE THIS to the owner's email

        const firebaseConfig = {
            apiKey: "AIzaSyBsmUPg2plkJS86sFkXU-QkJttJJcOj8dw",
            authDomain: "vrinda-cloud-kitchen.firebaseapp.com",
            projectId: "vrinda-cloud-kitchen",
            storageBucket: "vrinda-cloud-kitchen.appspot.com",
            messagingSenderId: "166281611781",
            appId: "1:166281611781:web:5090b4106e97e08931aa6c",
        };
        
        let app, db, auth;
        let isFirebaseReady = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            isFirebaseReady = true;
        } catch (error) {
            console.error("CRITICAL: Firebase Initialization failed.", error);
        }

        let userRole = 'customer'; // Default role
        let userId = null;
        let userEmail = 'Guest';

        // Load Google Charts
        google.charts.load('current', {'packages':['corechart', 'line']});

        const authBtn = document.getElementById('auth-btn');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                userEmail = user.email;

                // Fetch user role
                const userDocRef = doc(db, "users", userId);
                const userDocSnap = await getDoc(userDocRef);
                
                if (user.email === OWNER_EMAIL && !userDocSnap.exists()) {
                    // Auto-assign owner role on first login
                    await setDoc(userDocRef, { email: user.email, role: 'owner' });
                    userRole = 'owner';
                } else if (userDocSnap.exists()) {
                    userRole = userDocSnap.data().role;
                } else {
                    userRole = 'customer';
                }
                
                updateAuthStatusUI();
                updateVisibleViews();
                
                if (userRole === 'owner') {
                    loadOwnerDashboard();
                }

            } else {
                userId = null;
                userEmail = 'Guest';
                userRole = 'customer';
                updateAuthStatusUI();
                updateVisibleViews();
            }
        });

        const updateVisibleViews = () => {
            document.querySelector('[data-view="kitchen"]').classList.toggle('hidden', userRole !== 'kitchen' && userRole !== 'owner');
            document.querySelector('[data-view="transport"]').classList.toggle('hidden', userRole !== 'delivery' && userRole !== 'owner');
            document.querySelector('[data-view="owner"]').classList.toggle('hidden', userRole !== 'owner');
        }
        
        // --- Owner Dashboard Logic ---
        const loadOwnerDashboard = async () => {
            if (!isFirebaseReady || userRole !== 'owner') return;
            
            // Fetch all orders for charts
            const ordersQuery = query(collection(db, "orders"));
            const snapshot = await getDocs(ordersQuery);
            const allOrders = snapshot.docs.map(doc => ({...doc.data(), id: doc.id}));
            
            drawSalesChart(allOrders);
            drawStatusChart(allOrders);
            loadStaffList();
        }

        function drawSalesChart(orders) {
            const data = new google.visualization.DataTable();
            data.addColumn('date', 'Date');
            data.addColumn('number', 'Sales');

            const salesByDate = {};
            orders.forEach(order => {
                if (order.createdAt) {
                    const date = order.createdAt.toDate().toLocaleDateString();
                    salesByDate[date] = (salesByDate[date] || 0) + order.totalAmount;
                }
            });

            const sortedDates = Object.keys(salesByDate).sort((a,b) => new Date(a) - new Date(b));
            const rows = sortedDates.map(dateStr => [new Date(dateStr), salesByDate[dateStr]]);
            
            data.addRows(rows);

            const options = { title: 'Daily Sales Revenue', curveType: 'function', legend: { position: 'bottom' } };
            const chart = new google.visualization.LineChart(document.getElementById('sales_chart_div'));
            chart.draw(data, options);
        }

        function drawStatusChart(orders) {
            const statusCounts = {};
            orders.forEach(order => {
                const status = formatStatus(order.status);
                statusCounts[status] = (statusCounts[status] || 0) + 1;
            });

            const dataArray = [['Status', 'Count'], ...Object.entries(statusCounts)];
            const data = google.visualization.arrayToDataTable(dataArray);

            const options = { title: 'Order Status Distribution', is3D: true };
            const chart = new google.visualization.PieChart(document.getElementById('status_chart_div'));
            chart.draw(data, options);
        }

        // --- Staff Management Logic ---
        const staffListEl = document.getElementById('staff-list');
        const addStaffForm = document.getElementById('add-staff-form');

        const loadStaffList = async () => {
            const staffQuery = query(collection(db, "users"), where("role", "in", ["kitchen", "delivery"]));
            const snapshot = await getDocs(staffQuery);
            
            if (snapshot.empty) {
                staffListEl.innerHTML = '<p class="text-gray-500">No staff members found.</p>';
                return;
            }

            staffListEl.innerHTML = '';
            snapshot.docs.forEach(doc => {
                const staff = doc.data();
                const staffEl = document.createElement('div');
                staffEl.className = 'flex justify-between items-center bg-gray-50 p-3 rounded-lg';
                staffEl.innerHTML = `
                    <div>
                        <p class="font-medium text-gray-900">${staff.email}</p>
                        <p class="text-sm text-gray-500 capitalize">${staff.role}</p>
                    </div>
                    <button data-id="${doc.id}" class="remove-staff-btn bg-red-100 text-red-700 px-3 py-1 rounded-md text-sm hover:bg-red-200">Remove</button>
                `;
                staffListEl.appendChild(staffEl);
            });
        };

        addStaffForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('staff-email').value;
            const role = document.getElementById('staff-role').value;
            
            // Find user by email to get their UID
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("email", "==", email));
            const snapshot = await getDocs(q);
            
            if (snapshot.empty) {
                showAlert("Error: No user found with this email. The user must sign up in the app at least once before being assigned a role.");
                return;
            }
            
            const userDoc = snapshot.docs[0];
            await setDoc(doc(db, "users", userDoc.id), { email: email, role: role }, { merge: true });
            
            showAlert(`Successfully assigned ${role} role to ${email}.`);
            addStaffForm.reset();
            loadStaffList();
        });

        staffListEl.addEventListener('click', async (e) => {
            if (e.target.classList.contains('remove-staff-btn')) {
                const staffId = e.target.dataset.id;
                await updateDoc(doc(db, "users", staffId), { role: 'customer' });
                showAlert('Staff role removed. The user is now a regular customer.');
                loadStaffList();
            }
        });

        // The rest of your existing application logic (switchView, renderMenu, placeOrder, etc.) goes here.
        // Make sure to adapt the switchView logic to use the `userRole` variable for access control.
    </script>
</body>
</html>
