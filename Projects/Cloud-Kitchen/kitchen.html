<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Kitchen Order System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .view-active {
            display: block !important;
        }
        .view-hidden {
            display: none !important;
        }

        .btn-active {
            background-color: #4f46e5;
            color: white;
        }
        
        /* Status Colors */
        .status-new { background-color: #3b82f6; color: white; }
        .status-preparing { background-color: #f97316; color: white; }
        .status-ready_for_pickup { background-color: #16a34a; color: white; }
        .status-out_for_delivery { background-color: #6366f1; color: white; }
        .status-delivered { background-color: #6b7280; color: white; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Header -->
        <header class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center">
                <h1 class="text-3xl font-bold text-indigo-600 mb-4 sm:mb-0">Cloud Kitchen System</h1>
                
                <div class="flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4">
                    <!-- User Auth Status and Profile Button -->
                    <div class="flex items-center space-x-2">
                        <div id="auth-status" class="text-sm font-medium text-gray-600">
                            <!-- User status displayed here -->
                        </div>
                        <button id="profile-btn" class="bg-indigo-500 text-white px-3 py-1 text-sm font-medium rounded-md hover:bg-indigo-600 transition-colors duration-200">
                            Profile / Login
                        </button>
                    </div>

                    <!-- View Switcher -->
                    <div id="view-switcher" class="flex items-center bg-gray-200 rounded-lg p-1 space-x-1">
                        <button data-view="customer" class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">Customer</button>
                        <button data-view="kitchen" class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">Kitchen</button>
                        <button data-view="transport" class="px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200">Transport</button>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <!-- Customer View -->
            <div id="customer-view" class="view-hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Menu Column -->
                    <div class="lg:col-span-2">
                         <div class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Our Menu</h2>
                            <div id="menu-items" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Menu items will be injected here -->
                            </div>
                        </div>
                    </div>

                    <!-- Cart and Order Column -->
                    <div>
                        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Your Cart</h2>
                            <div id="cart-items" class="space-y-2 mb-4">
                                <p class="text-gray-500">Your cart is empty.</p>
                            </div>
                            <div class="border-t pt-4">
                                <p class="text-lg font-bold flex justify-between">Total: <span id="cart-total">₹0.00</span></p>
                            </div>
                        </div>
                        <div id="order-form-container" class="bg-white p-6 rounded-lg shadow-md">
                             <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Delivery Details</h2>
                             <!-- Note: Form inputs will be pre-filled if user is logged in -->
                             <form id="order-form">
                                <div class="space-y-4">
                                    <input type="text" id="customer-name" placeholder="Your Name" class="w-full p-2 border rounded-md" required>
                                    <input type="text" id="customer-address" placeholder="Delivery Address" class="w-full p-2 border rounded-md" required>
                                    <input type="tel" id="customer-phone" placeholder="Phone Number" class="w-full p-2 border rounded-md" required>
                                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-md hover:bg-indigo-700 transition-colors duration-200">Place Order</button>
                                </div>
                             </form>
                        </div>
                        <div id="order-status-container" class="hidden mt-6 bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-2xl font-semibold mb-4">Your Order Status</h2>
                            <p id="order-status-text" class="text-lg font-medium"></p>
                            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4">
                               <div id="order-progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kitchen View -->
            <div id="kitchen-view" class="view-hidden bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Incoming Orders</h2>
                <div id="kitchen-orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-500">No new orders at the moment.</p>
                    <!-- Kitchen orders will be injected here -->
                </div>
            </div>

            <!-- Transport View -->
            <div id="transport-view" class="view-hidden bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Ready for Delivery</h2>
                <div id="transport-orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-500">No orders ready for delivery.</p>
                    <!-- Transport orders will be injected here -->
                </div>
            </div>
        </main>
        
        <!-- Modal for alerts -->
        <div id="alert-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl p-6 w-11/12 md:w-1/3 text-center">
                <p id="alert-message" class="text-lg mb-4"></p>
                <button id="alert-close" class="bg-indigo-600 text-white px-4 py-2 rounded-md">OK</button>
            </div>
        </div>

        <!-- Profile/Auth Modal (New) -->
        <div id="profile-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl p-6 w-11/12 md:w-1/2 lg:w-1/3">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h2 id="modal-title" class="text-2xl font-semibold text-indigo-600">User Profile</h2>
                    <button id="profile-close" class="text-gray-500 hover:text-gray-800 text-xl font-bold">&times;</button>
                </div>
                
                <div id="profile-content">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Imports (Updated for all Auth methods and profile saving)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, where, serverTimestamp, setLogLevel, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBsmUPg2plkJS86sFkXU-QkJttJJcOj8dw",
            authDomain: "vrinda-cloud-kitchen.firebaseapp.com",
            projectId: "vrinda-cloud-kitchen",
            storageBucket: "vrinda-cloud-kitchen.firebasestorage.app",
            messagingSenderId: "166281611781",
            appId: "1:166281611781:web:5090b4106e97e08931aa6c",
            measurementId: "G-71YP1K3ETE"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Uncomment the line below to see detailed logs in the console
        // setLogLevel('debug');

        // --- App State ---
        let currentView = 'customer';
        let cart = [];
        let userId = null;
        let isAnonymous = true;
        let userEmail = 'Guest';
        let userProfile = null; // Stores { name, address, phone }
        
        let menu = [
            { id: 1, name: 'Paneer Butter Masala', price: 250, image: 'https://placehold.co/300x200/F9A825/FFFFFF?text=Paneer' },
            { id: 2, name: 'Dal Makhani', price: 200, image: 'https://placehold.co/300x200/8D6E63/FFFFFF?text=Dal' },
            { id: 3, name: 'Veg Biryani', price: 220, image: 'https://placehold.co/300x200/4CAF50/FFFFFF?text=Biryani' },
            { id: 4, name: 'Garlic Naan', price: 50, image: 'https://placehold.co/300x200/EFEBE9/000000?text=Naan' },
            { id: 5, name: 'Gulab Jamun (2pcs)', price: 60, image: 'https://placehold.co/300x200/C62828/FFFFFF?text=Dessert' },
            { id: 6, name: 'Masala Chai', price: 40, image: 'https://placehold.co/300x200/A1887F/FFFFFF?text=Chai' },
        ];
        let currentOrderListener = null;

        // --- UI Elements ---
        const viewSwitcher = document.getElementById('view-switcher');
        const views = {
            customer: document.getElementById('customer-view'),
            kitchen: document.getElementById('kitchen-view'),
            transport: document.getElementById('transport-view'),
        };
        const menuItemsContainer = document.getElementById('menu-items');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalEl = document.getElementById('cart-total');
        const orderForm = document.getElementById('order-form');
        const orderStatusContainer = document.getElementById('order-status-container');
        const orderStatusText = document.getElementById('order-status-text');
        const orderProgressBar = document.getElementById('order-progress-bar');
        const kitchenOrdersList = document.getElementById('kitchen-orders-list');
        const transportOrdersList = document.getElementById('transport-orders-list');
        
        // Modal Elements
        const alertModal = document.getElementById('alert-modal');
        const alertMessage = document.getElementById('alert-message');
        const alertClose = document.getElementById('alert-close');
        
        // Profile/Auth Elements (New)
        const profileBtn = document.getElementById('profile-btn');
        const profileModal = document.getElementById('profile-modal');
        const profileCloseBtn = document.getElementById('profile-close');
        const profileContent = document.getElementById('profile-content');
        const authStatusEl = document.getElementById('auth-status');


        const showAlert = (message) => {
            alertMessage.textContent = message;
            alertModal.classList.remove('hidden');
        }
        alertClose.addEventListener('click', () => alertModal.classList.add('hidden'));
        profileCloseBtn.addEventListener('click', () => profileModal.classList.add('hidden'));


        // --- Helper Functions ---
        const formatCurrency = (amount) => `₹${amount.toFixed(2)}`;
        const formatStatus = (status) => {
            return (status || 'new').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        };

        const updateAuthStatusUI = () => {
            authStatusEl.innerHTML = isAnonymous 
                ? '<span class="text-sm text-gray-500">Logged in as: <b>Guest</b></span>'
                : `<span class="text-sm text-indigo-700">Logged in as: <b>${userEmail}</b></span>`;
            
            profileBtn.textContent = isAnonymous ? 'Profile / Login' : 'My Profile';
        };

        // --- Profile Management (New) ---

        const saveUserProfile = async (profileData) => {
            if (isAnonymous) return; // Only save profiles for authenticated users
            const profileRef = doc(db, "profiles", userId);
            try {
                await setDoc(profileRef, profileData, { merge: true });
                userProfile = profileData;
                showAlert('Profile details saved!');
            } catch (error) {
                console.error("Error saving profile: ", error);
                showAlert('Failed to save profile details.');
            }
        };

        const fetchUserProfile = async (uid) => {
            const profileRef = doc(db, "profiles", uid);
            try {
                const docSnap = await getDoc(profileRef);
                if (docSnap.exists()) {
                    userProfile = docSnap.data();
                    updateCustomerFormWithProfile();
                } else {
                    userProfile = { name: '', address: '', phone: '' };
                }
            } catch (error) {
                console.error("Error fetching profile: ", error);
                userProfile = { name: '', address: '', phone: '' };
            }
        };
        
        const updateCustomerFormWithProfile = () => {
             if (isAnonymous || !userProfile) return;
             // Pre-fill fields if profile data exists
             document.getElementById('customer-name').value = userProfile.name || '';
             document.getElementById('customer-address').value = userProfile.address || '';
             document.getElementById('customer-phone').value = userProfile.phone || '';
        }

        // --- Authentication Logic (New) ---

        profileBtn.addEventListener('click', () => {
            profileModal.classList.remove('hidden');
            renderProfileModal();
        });

        const renderProfileModal = () => {
            if (isAnonymous) {
                profileContent.innerHTML = `
                    <h3 class="text-xl font-semibold mb-4">Login or Signup</h3>
                    <button id="google-login-btn" class="w-full flex items-center justify-center bg-red-600 text-white font-bold py-2 rounded-md hover:bg-red-700 transition-colors duration-200 mb-4">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M22.001 12.001c0-.709-.062-1.4-.183-2.071H12v3.911h5.368c-.237 1.187-.881 2.221-1.854 2.915v2.541h3.275c1.921-1.776 3.03-4.4 3.03-7.296z" fill="#4285F4"/><path d="M12 22.001c3.275 0 6.012-1.077 8.016-2.915l-3.275-2.541c-.911.611-2.086.973-3.411.973-2.618 0-4.84-1.758-5.632-4.118H3.149v2.627C5.174 20.312 8.358 22.001 12 22.001z" fill="#34A853"/><path d="M5.632 14.118c-.161-.482-.26-1.002-.26-1.558s.099-1.076.26-1.558V8.375H2.357c-.504.992-.796 2.115-.796 3.344s.292 2.352.796 3.344l3.275-2.627z" fill="#FBBC05"/><path d="M12 5.882c1.474 0 2.797.502 3.847 1.498l2.766-2.766C16.985 3.09 14.65 2 12 2c-3.642 0-6.826 1.689-8.847 4.484l3.275 2.627c.792-2.36 3.014-4.118 5.632-4.118z" fill="#EA4335"/></svg>
                        Sign in with Google
                    </button>
                    <div class="flex items-center my-4">
                        <div class="flex-grow border-t border-gray-300"></div>
                        <span class="flex-shrink mx-4 text-gray-500">OR</span>
                        <div class="flex-grow border-t border-gray-300"></div>
                    </div>
                    <form id="email-auth-form" class="space-y-4">
                        <input type="email" id="auth-email" placeholder="Email" class="w-full p-3 border rounded-md" required>
                        <input type="password" id="auth-password" placeholder="Password (min 6 chars)" class="w-full p-3 border rounded-md" required>
                        <button type="submit" id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-md hover:bg-indigo-700 transition-colors duration-200">Login</button>
                        <button type="button" id="signup-btn" class="w-full bg-gray-200 text-gray-800 font-bold py-3 rounded-md hover:bg-gray-300 transition-colors duration-200">Create Account</button>
                    </form>
                `;
            } else {
                profileContent.innerHTML = `
                    <p class="text-lg mb-4">You are logged in as: <b class="text-indigo-600">${userEmail}</b></p>
                    <h3 class="text-xl font-semibold mb-4 border-t pt-4">Update Profile Details</h3>
                    <form id="profile-update-form" class="space-y-4">
                        <input type="text" id="profile-name" placeholder="Name" class="w-full p-3 border rounded-md" value="${userProfile?.name || ''}">
                        <input type="text" id="profile-address" placeholder="Default Delivery Address" class="w-full p-3 border rounded-md" value="${userProfile?.address || ''}">
                        <input type="tel" id="profile-phone" placeholder="Phone Number" class="w-full p-3 border rounded-md" value="${userProfile?.phone || ''}">
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-md hover:bg-green-700 transition-colors duration-200">Save Profile</button>
                    </form>
                    <div class="border-t my-6"></div>
                    <button id="logout-btn" class="w-full bg-red-500 text-white font-bold py-3 rounded-md hover:bg-red-600 transition-colors duration-200">Logout</button>
                `;
            }
            attachAuthListeners();
        };

        const handleGoogleLogin = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                profileModal.classList.add('hidden');
                showAlert('Signed in with Google successfully!');
            } catch (error) {
                console.error("Google Login Error:", error);
                showAlert('Google Sign-In failed. Please try again.');
            }
        };

        const handleEmailAuth = async (e, isSignup) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (isSignup) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showAlert('Account created and logged in!');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showAlert('Logged in successfully!');
                }
                profileModal.classList.add('hidden');
            } catch (error) {
                console.error("Email Auth Error:", error);
                let message = 'Authentication failed.';
                if (error.code === 'auth/email-already-in-use') { message = 'This email is already registered. Try logging in.'; }
                else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') { message = 'Invalid email or password.'; }
                else if (error.code === 'auth/weak-password') { message = 'Password must be at least 6 characters.'; }
                showAlert(message);
            }
        };
        
        const handleProfileUpdate = async (e) => {
            e.preventDefault();
            const name = document.getElementById('profile-name').value;
            const address = document.getElementById('profile-address').value;
            const phone = document.getElementById('profile-phone').value;

            await saveUserProfile({ name, address, phone, email: userEmail });
            profileModal.classList.add('hidden');
        };

        const handleLogout = async () => {
            try {
                await signOut(auth);
                profileModal.classList.add('hidden');
                showAlert('Logged out successfully.');
            } catch (error) {
                console.error("Logout Error:", error);
                showAlert('Logout failed.');
            }
        };

        const attachAuthListeners = () => {
            if (!isAnonymous) {
                document.getElementById('profile-update-form')?.addEventListener('submit', handleProfileUpdate);
                document.getElementById('logout-btn')?.addEventListener('click', handleLogout);
            } else {
                document.getElementById('google-login-btn')?.addEventListener('click', handleGoogleLogin);
                document.getElementById('login-btn')?.addEventListener('click', (e) => handleEmailAuth(e, false));
                document.getElementById('signup-btn')?.addEventListener('click', (e) => handleEmailAuth(e, true));
            }
        };


        // --- View Management ---
        const switchView = (view) => {
            currentView = view;
            Object.keys(views).forEach(key => {
                views[key].classList.toggle('view-active', key === view);
                views[key].classList.toggle('view-hidden', key !== view);
            });
            const buttons = viewSwitcher.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.toggle('btn-active', btn.dataset.view === view);
            });
        };

        viewSwitcher.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                switchView(e.target.dataset.view);
            }
        });

        // --- Customer View Logic ---
        const renderMenu = () => {
            menuItemsContainer.innerHTML = '';
            menu.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'border rounded-lg p-4 flex flex-col items-start shadow-sm';
                itemEl.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="w-full h-40 object-cover rounded-md mb-4">
                    <h3 class="text-lg font-semibold">${item.name}</h3>
                    <p class="text-gray-600 mb-2">${formatCurrency(item.price)}</p>
                    <button data-id="${item.id}" class="add-to-cart-btn mt-auto bg-indigo-100 text-indigo-700 font-semibold py-2 px-4 rounded-md hover:bg-indigo-200 transition-colors duration-200">Add to Cart</button>
                `;
                menuItemsContainer.appendChild(itemEl);
            });
        };
        
        const updateCart = () => {
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-500">Your cart is empty.</p>';
                cartTotalEl.textContent = formatCurrency(0);
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const cartItemEl = document.createElement('div');
                cartItemEl.className = 'flex justify-between items-center';
                cartItemEl.innerHTML = `
                    <span>${item.name} x ${item.quantity}</span>
                    <span class="font-medium">${formatCurrency(item.price * item.quantity)}</span>
                `;
                cartItemsContainer.appendChild(cartItemEl);
                total += item.price * item.quantity;
            });

            cartTotalEl.textContent = formatCurrency(total);
        };

        menuItemsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('add-to-cart-btn')) {
                const itemId = parseInt(e.target.dataset.id);
                const menuItem = menu.find(item => item.id === itemId);
                const cartItem = cart.find(item => item.id === itemId);

                if (cartItem) {
                    cartItem.quantity++;
                } else {
                    cart.push({ ...menuItem, quantity: 1 });
                }
                updateCart();
            }
        });

        const placeOrder = async (e) => {
            e.preventDefault();
            if (cart.length === 0) {
                showAlert('Your cart is empty. Please add items to place an order.');
                return;
            }
            
            const customerName = document.getElementById('customer-name').value;
            const customerAddress = document.getElementById('customer-address').value;
            const customerPhone = document.getElementById('customer-phone').value;

            const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            try {
                // If the user is logged in, save their details before placing the order
                if (!isAnonymous) {
                    await saveUserProfile({ name: customerName, address: customerAddress, phone: customerPhone, email: userEmail });
                }
                
                const orderData = {
                    customerName,
                    customerAddress,
                    customerPhone,
                    items: cart,
                    totalAmount,
                    status: 'new',
                    createdAt: serverTimestamp(),
                    userId: userId, // Store the UID (anonymous or authenticated)
                    isAnonymousOrder: isAnonymous
                };
                const docRef = await addDoc(collection(db, "orders"), orderData);
                showAlert('Order placed successfully!');
                
                // Switch to status view
                document.getElementById('order-form-container').classList.add('hidden');
                orderStatusContainer.classList.remove('hidden');
                trackOrderStatus(docRef.id);

                // Reset cart
                cart = [];
                updateCart();
                orderForm.reset();
            } catch (error) {
                console.error("Error placing order: ", error);
                showAlert('Failed to place order. Please try again.');
            }
        };
        
        const trackOrderStatus = (orderId) => {
            // Unsubscribe from previous listener if it exists
            if (currentOrderListener) {
                currentOrderListener();
            }
            
            const orderRef = doc(db, "orders", orderId);
            currentOrderListener = onSnapshot(orderRef, (doc) => {
                if(doc.exists()){
                    const order = doc.data();
                    const status = order.status;
                    orderStatusText.textContent = `Status: ${formatStatus(status)}`;
                    
                    const statusMap = { 'new': 10, 'preparing': 40, 'ready_for_pickup': 70, 'out_for_delivery': 90, 'delivered': 100 };
                    const progress = statusMap[status] || 0;
                    orderProgressBar.style.width = `${progress}%`;
                } else {
                    orderStatusText.textContent = "Order not found.";
                    if(currentOrderListener) currentOrderListener();
                }
            });
        };

        orderForm.addEventListener('submit', placeOrder);

        // --- Kitchen & Transport Views Logic ---
        const renderOrders = (container, orders) => {
            container.innerHTML = '';
            if (orders.length === 0) {
                const viewName = container.id.includes('kitchen') ? 'new orders' : 'orders ready for delivery';
                container.innerHTML = `<p class="text-gray-500 col-span-full">No ${viewName} at the moment.</p>`;
                return;
            }
            orders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'bg-gray-50 border rounded-lg p-4 shadow-sm flex flex-col';
                const itemsHtml = order.items.map(i => `<li>${i.name} x ${i.quantity}</li>`).join('');
                
                let actionButtonHtml = '';
                if(currentView === 'kitchen') {
                   if (order.status === 'new') {
                       actionButtonHtml = `<button data-id="${order.id}" data-status="preparing" class="update-status-btn w-full bg-orange-500 text-white font-bold py-2 rounded-md mt-4 hover:bg-orange-600">Start Preparing</button>`;
                   } else if (order.status === 'preparing') {
                       actionButtonHtml = `<button data-id="${order.id}" data-status="ready_for_pickup" class="update-status-btn w-full bg-green-500 text-white font-bold py-2 rounded-md mt-4 hover:bg-green-600">Mark as Ready</button>`;
                   }
                } else if (currentView === 'transport') {
                   if (order.status === 'ready_for_pickup') {
                        actionButtonHtml = `<button data-id="${order.id}" data-status="out_for_delivery" class="update-status-btn w-full bg-blue-500 text-white font-bold py-2 rounded-md mt-4 hover:bg-blue-600">Out for Delivery</button>`;
                   } else if (order.status === 'out_for_delivery') {
                        actionButtonHtml = `<button data-id="${order.id}" data-status="delivered" class="update-status-btn w-full bg-gray-500 text-white font-bold py-2 rounded-md mt-4 hover:bg-gray-600">Mark as Delivered</button>`;
                   }
                }

                orderCard.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-2">
                             <h3 class="text-lg font-bold">${order.customerName}</h3>
                             <span class="status-${order.status} text-xs font-semibold px-2 py-1 rounded-full">${formatStatus(order.status)}</span>
                        </div>
                        <p class="text-sm text-gray-600">${order.customerAddress}</p>
                        <p class="text-sm text-gray-600 mb-2">${order.customerPhone}</p>
                        <div class="border-t my-2"></div>
                        <ul class="list-disc list-inside text-sm space-y-1">${itemsHtml}</ul>
                    </div>
                    <div class="border-t mt-2 pt-2 text-right font-bold text-lg">${formatCurrency(order.totalAmount)}</div>
                    ${actionButtonHtml}
                `;
                container.appendChild(orderCard);
            });
        };

        const updateOrderStatus = async (orderId, newStatus) => {
            const orderRef = doc(db, "orders", orderId);
            try {
                await updateDoc(orderRef, { status: newStatus });
            } catch (error) {
                console.error("Error updating order status: ", error);
                showAlert('Failed to update order status.');
            }
        };

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('update-status-btn')) {
                const orderId = e.target.dataset.id;
                const newStatus = e.target.dataset.status;
                updateOrderStatus(orderId, newStatus);
            }
        });


        // --- Firestore Listeners ---
        const listenToKitchenOrders = () => {
            const q = query(collection(db, "orders"), where("status", "in", ["new", "preparing"]));
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                orders.sort((a,b) => a.createdAt?.toMillis() - b.createdAt?.toMillis());
                renderOrders(kitchenOrdersList, orders);
            });
        };

        const listenToTransportOrders = () => {
            const q = query(collection(db, "orders"), where("status", "in", ["ready_for_pickup", "out_for_delivery"]));
            onSnapshot(q, (snapshot) => {
                const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                orders.sort((a,b) => a.createdAt?.toMillis() - b.createdAt?.toMillis());
                renderOrders(transportOrdersList, orders);
            });
        };
        
        // --- Initialization ---
        const startApp = async () => {
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    isAnonymous = user.isAnonymous;
                    userEmail = user.email || user.displayName || 'Anonymous User';
                    
                    if (!isAnonymous) {
                         // Only fetch profile data for logged-in users
                        await fetchUserProfile(userId);
                    } else {
                        userProfile = null;
                    }
                } else {
                    // Fallback to anonymous sign-in if no user exists (first load)
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Anonymous sign-in failed: ", error);
                        showAlert('Authentication failed. Check Firebase setup.');
                        return;
                    }
                    return; // onAuthStateChanged will be called again with the anonymous user
                }

                // Initialize views and data listeners once auth state is stable
                switchView('customer');
                renderMenu();
                updateCart();
                updateAuthStatusUI();
                updateCustomerFormWithProfile(); // Pre-fill form if logged in
                listenToKitchenOrders();
                listenToTransportOrders();
            });
        };

        startApp();

    </script>
</body>
</html>
